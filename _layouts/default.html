<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Barlow+Condensed:wght@400;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
  {% include custom-head.html %}
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header>
  <div class="hdr">
    <a class="hdr-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="hdr-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on"{% endif %}>Posts</a>
      {% for p in site.header_pages %}
        {% assign pg = site.pages | where: "path", p | first %}
        <a href="{{ pg.url | relative_url }}"{% if page.url == pg.url %} class="on"{% endif %}>{{ pg.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>

<main id="main">
  {{ content }}
</main>

<footer>
  <div class="ftr">
    <span class="ftr-name">{{ site.title }}</span>
    <div class="ftr-links">
      <a class="ftr-link" href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a class="ftr-link" href="https://github.com/greystoke1337/blog" target="_blank" rel="noopener">GitHub</a>
      <a class="ftr-link" href="https://ko-fi.com/R6R61VRQHC" target="_blank" rel="noopener">Ko-fi</a>
    </div>
  </div>
</footer>

</body>
</html>
